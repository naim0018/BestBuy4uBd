services:
  bestbuy-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_USER:-mdkazinaim}/bestbuy-frontend:latest
    container_name: bestbuy-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
